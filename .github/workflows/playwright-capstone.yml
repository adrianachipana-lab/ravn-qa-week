# CI — runs all QA suites, classifies results, fails on unexpected regressions.
name: QA Test Suite

on:
  push:
    paths: ['wednesday/**', 'thursday/**', 'friday-capstone/**', 'improvements/**',
            'shared/**', 'package.json', 'package-lock.json', '.github/**', '*.mjs', '*.config.ts']
  pull_request:
    paths: ['**/*.ts', '**/*.mjs', 'package.json', '.github/**']
  workflow_dispatch:

concurrency:
  group: qa-tests
  cancel-in-progress: false

env:
  CI: 'true'
  PATIENT_EMAIL: ${{ secrets.PATIENT_EMAIL }}
  PATIENT_PASSWORD: ${{ secrets.PATIENT_PASSWORD }}
  SECOND_PATIENT_EMAIL: ${{ secrets.SECOND_PATIENT_EMAIL }}
  SECOND_PATIENT_PASSWORD: ${{ secrets.SECOND_PATIENT_PASSWORD }}
  API_PATIENT_EMAIL: ${{ secrets.API_PATIENT_EMAIL }}
  API_PATIENT_PASSWORD: ${{ secrets.API_PATIENT_PASSWORD }}
  DOCTOR_EMAIL: ${{ secrets.DOCTOR_EMAIL }}
  DOCTOR_PASSWORD: ${{ secrets.DOCTOR_PASSWORD }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run all suites with classifier
        id: run
        run: node run-all.mjs

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            wednesday/playwright-report
            thursday/playwright-report
            friday-capstone/playwright-report
            improvements/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            wednesday/test-results
            thursday/test-results
            friday-capstone/test-results
            improvements/test-results
            */results.json
          retention-days: 7
          if-no-files-found: ignore
